<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Fortnite Sprite Tracker</title>
    <style>
        :root {
            --bg-color: #0b0c16;
            --card-bg: #141628;
            --card-border: #232745;
            --accent-purple: #8b5cf6;
            --text-color: #ffffff;
            --text-dim: #8f96b3;

            --v-base: #3b82f6;
            --v-gold: #facc15;
            --v-holofoil: #2dd4bf;
            --v-gummy: #f472b6;
            --v-cube: #9333ea;
            --v-galaxy: #6366f1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: max(15px, env(safe-area-inset-top)) max(15px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(15px, env(safe-area-inset-left));
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 1000px;
            margin-bottom: 20px;
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 12px;
            background: linear-gradient(90deg, #facc15, #8b5cf6, #2dd4bf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stats-bar {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 14px 16px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 10px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        .stats-info {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .progress-outer {
            width: 100%;
            height: 12px;
            background: #1c2038;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--card-border);
        }

        .progress-inner {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #8b5cf6, #2dd4bf);
            transition: width 0.3s ease;
        }

        .controls {
            display: flex;
            gap: 8px;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .search-input {
            background: #1a1d33;
            border: 1px solid var(--card-border);
            color: #fff;
            padding: 10px 14px;
            border-radius: 8px;
            outline: none;
            flex-grow: 1;
            font-size: 0.95rem;
        }

        .btn {
            background: #1a1d33;
            border: 1px solid var(--card-border);
            color: #fff;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .btn-reset {
            color: #ff6b81;
            border-color: #611e2d;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
            gap: 12px;
            width: 100%;
            max-width: 1000px;
        }

        .card {
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: 0.1s;
        }

        .card:active {
            transform: scale(0.96);
        }

        .card.completed {
            border-color: #10b981;
        }

        .card-preview {
            width: 100%;
            height: 130px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sprite-img {
            width: 90px;
            height: 90px;
            object-fit: contain;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
        }

        .badge {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(0, 0, 0, 0.7);
            padding: 2px 6px;
            border-radius: 8px;
            font-size: 0.7rem;
            font-weight: bold;
        }

        .card-name {
            position: absolute;
            bottom: 6px;
            left: 6px;
            font-size: 0.85rem;
            font-weight: 800;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .card-variants-bar {
            background: #0f1120;
            padding: 8px 4px;
            display: flex;
            justify-content: center;
            gap: 5px;
            border-top: 1px solid var(--card-border);
        }

        .v-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #232745;
        }

        .v-dot.active-base { background: var(--v-base); box-shadow: 0 0 5px var(--v-base); }
        .v-dot.active-gold { background: var(--v-gold); box-shadow: 0 0 5px var(--v-gold); }
        .v-dot.active-holofoil { background: var(--v-holofoil); box-shadow: 0 0 5px var(--v-holofoil); }
        .v-dot.active-gummy { background: var(--v-gummy); box-shadow: 0 0 5px var(--v-gummy); }
        .v-dot.active-cube { background: var(--v-cube); box-shadow: 0 0 5px var(--v-cube); }
        .v-dot.active-galaxy { background: var(--v-galaxy); box-shadow: 0 0 5px var(--v-galaxy); }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: #141628;
            width: 90%;
            max-width: 400px;
            border-radius: 16px;
            padding: 20px;
        }

        .variant-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            margin-bottom: 8px;
            background: #0f1120;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            cursor: pointer;
        }

        .variant-item.checked {
            border-color: var(--accent-purple);
            background: rgba(139, 92, 246, 0.1);
        }

        .checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid var(--card-border);
            border-radius: 4px;
        }

        .checked .checkbox {
            background: var(--accent-purple);
            border-color: var(--accent-purple);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .checked .checkbox::after {
            content: '✓';
            font-size: 12px;
            color: white;
        }

        @media (min-width: 600px) {
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }

            .card-preview {
                height: 160px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Sprite Tracker</h1>
        <div class="stats-bar">
            <div class="stats-info">
                <span>COLLECTED</span>
                <span id="progress-text">0 / 0 (0%)</span>
            </div>
            <div class="progress-outer">
                <div class="progress-inner" id="progress-bar"></div>
            </div>
            <div class="controls">
                <input type="text" id="search" class="search-input" placeholder="Search..." oninput="renderGrid()">
                <button class="btn btn-reset" onclick="resetAll()">Reset</button>
            </div>
        </div>
    </header>

    <div class="grid" id="sprite-grid"></div>

    <div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
        <div class="modal">
            <h2 id="modal-title" style="margin-bottom: 15px;">Variants</h2>
            <div id="variant-list"></div>
        </div>
    </div>

    <script>
        const variantMeta = {
            base: { label: 'Base', className: 'base' },
            holofoil: { label: 'Holofoil', className: 'holofoil' },
            gold: { label: 'Gold', className: 'gold' },
            gummy: { label: 'Gummy', className: 'gummy' },
            cube: { label: 'Cube', className: 'cube' },
            galaxy: { label: 'Galaxy', className: 'galaxy' }
        };

        function getVariantLabel(key) {
            return variantMeta[key]?.label || key;
        }

        function getVariantClassKey(key) {
            return variantMeta[key]?.className || key;
        }

         const spritesData = [
            { id: 'zeropoint', name: 'Zero Point', variants: ['base', 'gold', 'gummy', 'galaxy'], bg: '#0c4a6e' },
            { id: 'burntpeanut', name: 'Burnt Peanut', variants: ['base'], bg: '#451a03' },
            { id: 'batman', name: 'Batman', variants: ['base', 'gold', 'gummy', 'galaxy', 'holofoil', 'cube'], bg: '#171717' },
            { id: 'pollo', name: 'Pollo', variants: ['base'], bg: '#854d0e' },
            { id: 'vinijr', name: 'Vini JR', variants: ['base'], bg: '#14532d' },
            { id: 'dream', name: 'Dream', variants: ['base', 'gold', 'gummy', 'galaxy', 'cube'], bg: '#9a3412' },
            { id: 'punk', name: 'Punk', variants: ['base', 'gold', 'gummy', 'galaxy', 'cube'], bg: '#431407' },
            { id: 'boss', name: 'Boss', variants: ['base', 'gold', 'gummy', 'galaxy', 'cube'], bg: '#ea580c' },
            { id: 'seven', name: 'The Seven', variants: ['base', 'gold', 'gummy', 'galaxy', 'holofoil'], bg: '#1e293b' },
            { id: 'grim', name: 'Grim Reaper', variants: ['base', 'gold', 'gummy', 'galaxy', 'cube'], bg: '#18181b' },
            { id: 'demon', name: 'Demon', variants: ['base', 'gold', 'gummy', 'galaxy'], bg: '#450a0a' },
            { id: 'king', name: 'King', variants: ['base', 'gold', 'gummy', 'galaxy', 'holofoil'], bg: '#3b0764' },
            { id: 'aura', name: 'Aura', variants: ['base', 'gold', 'gummy', 'galaxy'], bg: '#1e1b4b' },
            { id: 'striker', name: 'Striker', variants: ['base', 'gold', 'gummy', 'galaxy', 'holofoil'], bg: '#1e3a8a' },
            { id: 'fire', name: 'Fire', variants: ['base', 'gold', 'gummy', 'galaxy', 'holofoil', 'cube'], bg: '#911b1b' },
            { id: 'earth', name: 'Earth', variants: ['base', 'gold', 'gummy', 'galaxy', 'cube'], bg: '#166534' },
            { id: 'water', name: 'Water', variants: ['base', 'gold', 'gummy', 'galaxy', 'holofoil'], bg: '#0284c7' },
            { id: 'ghost', name: 'Ghost', variants: ['base', 'gold', 'gummy', 'galaxy', 'holofoil'], bg: '#581c87' },
            { id: 'duck', name: 'Duck', variants: ['base', 'gold', 'gummy', 'galaxy'], bg: '#701a75' },
            { id: 'air', name: 'Air', variants: ['base', 'gold', 'gummy', 'galaxy', 'holofoil'], bg: '#334155' },
            { id: 'fishy', name: 'Fishy', variants: ['base', 'gold', 'gummy', 'galaxy', 'cube'], bg: '#075985' }
        ];

        const totalTrackedVariants = spritesData.reduce((total, sprite) => total + sprite.variants.length, 0);

        function loadProgress() {
            try {
                const stored = JSON.parse(localStorage.getItem('fn_sprite_v1'));
                if (!stored || typeof stored !== 'object') return {};

                const normalized = {};
                Object.entries(stored).forEach(([spriteId, ownedVariants]) => {
                    const sprite = spritesData.find(s => s.id === spriteId);
                    if (!sprite || !Array.isArray(ownedVariants)) return;

                    const valid = ownedVariants.filter(v => sprite.variants.includes(v));
                    if (valid.length) normalized[spriteId] = valid;
                });

                return normalized;
            } catch (error) {
                console.warn('Could not load tracker progress:', error);
                return {};
            }
        }

        function saveProgress() {
            localStorage.setItem('fn_sprite_v1', JSON.stringify(userProgress));
        }

        function buildSpriteSvg(sprite) {
            const initials = sprite.name
                .split(/[\s-]+/)
                .filter(Boolean)
                .slice(0, 2)
                .map(word => word[0])
                .join('')
                .toUpperCase() || 'SP';

            const svg = `
                <svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
                    <rect width="160" height="160" rx="24" fill="${sprite.bg}" />
                    <circle cx="80" cy="64" r="34" fill="rgba(255,255,255,0.16)" />
                    <path d="M80 30c-16 0-29 13-29 29 0 17.2 13.3 29.4 29 29.4s29-12.2 29-29.4c0-16-13-29-29-29Z" fill="rgba(255,255,255,0.22)" />
                    <rect x="46" y="94" width="68" height="24" rx="12" fill="rgba(0,0,0,0.28)" />
                    <text x="80" y="110" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#fff">${initials}</text>
                </svg>
            `;

            return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
        }

        let userProgress = loadProgress();

        function renderGrid() {
            const grid = document.getElementById('sprite-grid');
            const searchVal = document.getElementById('search').value.toLowerCase();
            grid.innerHTML = '';

            let totalOwned = 0;
            let totalMax = 0;

            spritesData.forEach(sprite => {
                const owned = userProgress[sprite.id] || [];
                const max = sprite.variants.length;

                totalMax += max;
                totalOwned += owned.length;

                if (searchVal && !sprite.name.toLowerCase().includes(searchVal)) return;

                const card = document.createElement('div');
                card.className = `card ${owned.length === max ? 'completed' : ''}`;
                card.onclick = () => openModal(sprite.id);

                let dots = '';
                sprite.variants.forEach(v => {
                    const activeClass = owned.includes(v) ? `active-${getVariantClassKey(v)}` : '';
                    dots += `<div class="v-dot ${activeClass}"></div>`;
                });

                card.innerHTML = `
                    <div class="card-preview" style="background: ${sprite.bg}">
                        <div class="badge">${owned.length}/${max}</div>
                        <img class="sprite-img" src="${buildSpriteSvg(sprite)}" alt="${sprite.name}">
                        <div class="card-name">${sprite.name}</div>
                    </div>
                    <div class="card-variants-bar">${dots}</div>
                `;

                grid.appendChild(card);
            });

            const percent = totalMax > 0 ? Math.round((totalOwned / totalMax) * 100) : 0;
            document.getElementById('progress-text').innerText = `${totalOwned} / ${totalTrackedVariants} (${percent}%)`;
            document.getElementById('progress-bar').style.width = `${percent}%`;
        }

        function openModal(id) {
            const sprite = spritesData.find(s => s.id === id);
            if (!sprite) return;

            document.getElementById('modal-title').innerText = sprite.name;
            const list = document.getElementById('variant-list');
            list.innerHTML = '';

            const owned = userProgress[id] || [];
            sprite.variants.forEach(v => {
                const item = document.createElement('div');
                item.className = `variant-item ${owned.includes(v) ? 'checked' : ''}`;
                item.onclick = () => {
                    toggleVariant(id, v);
                    openModal(id);
                };

                item.innerHTML = `<span>${getVariantLabel(v)} Style</span><div class="checkbox"></div>`;
                list.appendChild(item);
            });

            document.getElementById('modal-overlay').classList.add('active');
        }

        function toggleVariant(id, v) {
            if (!userProgress[id]) userProgress[id] = [];

            const idx = userProgress[id].indexOf(v);
            if (idx > -1) {
                userProgress[id].splice(idx, 1);
            } else {
                userProgress[id].push(v);
            }

            if (userProgress[id].length === 0) {
                delete userProgress[id];
            }

            saveProgress();
            renderGrid();
        }

        function closeModal(e) {
            if (e.target.id === 'modal-overlay') {
                document.getElementById('modal-overlay').classList.remove('active');
            }
        }

        function resetAll() {
            if (confirm('Reset all progress?')) {
                userProgress = {};
                localStorage.removeItem('fn_sprite_v1');
                renderGrid();
            }
        }

        renderGrid();
    </script>
</body>
</html>
