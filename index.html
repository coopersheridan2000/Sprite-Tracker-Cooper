<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortnite Sprite Tracker</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --rarity-rare: #3b82f6;
            --rarity-epic: #a855f7;
            --rarity-legendary: #f59e0b;
            --rarity-mythic: #ef4444;
            
            --v-base: #a3a3a3;
            --v-gold: #fbbf24;
            --v-gummy: #ec4899;
            --v-galaxy: #8b5cf6;
            --v-holofoil: #2dd4bf;
            --v-cube: #d946ef;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .search-bar {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: white;
            width: 300px;
        }

        .btn {
            padding: 10px 15px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            color: white;
            background: #3b82f6;
        }
        .btn-danger { background: #ef4444; }

        /* Progress Bars */
        .progress-section {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 0.9rem;
            font-weight: bold;
        }
        .progress-track {
            background: #333;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: #2dd4bf;
            transition: width 0.3s;
        }
        .mastery-fill { background: #f59e0b; }

        /* Timer & Optimizer Section */
        .tools-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .tool-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
        }
        .timer-display {
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            margin: 10px 0;
            font-family: monospace;
        }
        .timer-controls { display: flex; justify-content: center; gap: 10px; }
        .btn-timer-start { background: #10b981; }
        .btn-timer-pause { background: #f59e0b; }
        
        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background: #2a2a2a;
            color: white;
            border: 1px solid #333;
            border-radius: 5px;
        }

        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            border: 2px solid transparent;
            transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-5px); }
        .card.completed { border-color: #2dd4bf; }
        .card.mastered { border-color: #f59e0b; }

        .badge {
            position: absolute;
            top: 5px;
            left: 5px;
            background: rgba(0,0,0,0.8);
            padding: 2px 6px;
            font-size: 0.7rem;
            border-radius: 4px;
            font-weight: bold;
            z-index: 2;
        }

        .card-preview {
            position: relative;
            width: 100%;
            height: 140px;
            overflow: hidden;
        }
        .sprite-img {
            width: 100%;
            height: 100%;
            image-rendering: pixelated; /* Keeps sprites crisp */
        }
        
        .owned-stamp, .mastered-stamp {
            position: absolute;
            bottom: 5px;
            right: 5px;
            padding: 3px 6px;
            font-size: 0.7rem;
            font-weight: bold;
            border-radius: 4px;
        }
        .owned-stamp { background: #2dd4bf; color: #000; }
        .mastered-stamp { background: #f59e0b; color: #000; }

        .card-variants-bar {
            display: flex;
            padding: 5px;
            justify-content: center;
            gap: 3px;
            background: rgba(0,0,0,0.3);
        }
        .v-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #333;
        }
        .active-base { background: var(--v-base); }
        .active-gold { background: var(--v-gold); }
        .active-gummy { background: var(--v-gummy); }
        .active-galaxy { background: var(--v-galaxy); }
        .active-holofoil { background: var(--v-holofoil); }
        .active-cube { background: var(--v-cube); }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 15px;
        }
        .modal-chances-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 15px 0; background: #2a2a2a; padding: 10px; border-radius: 5px;
        }
        .chance-item { display: flex; flex-direction: column; text-align: center; font-size: 0.85rem;}
        .chance-label { color: var(--text-muted); }
        .chance-val { font-weight: bold; }

        .variant-item {
            background: #2a2a2a; padding: 10px; margin-bottom: 10px; border-radius: 5px;
        }
        .variant-item-top { margin-bottom: 10px; font-weight: bold; }
        .variant-controls-group { display: flex; gap: 10px; }
        
        .control-pill {
            flex: 1; padding: 8px; text-align: center; border-radius: 5px; background: #333; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem;
        }
        .control-pill.active.collected { background: rgba(45, 212, 191, 0.2); border: 1px solid #2dd4bf; }
        .control-pill.active.mastered { background: rgba(245, 158, 11, 0.2); border: 1px solid #f59e0b; }
        .checkbox { width: 16px; height: 16px; border-radius: 3px; border: 2px solid #555; }
        .control-pill.active .checkbox { background: currentColor; border-color: currentColor; }
        .control-pill.collected.active .checkbox { background: #2dd4bf; border-color: #2dd4bf; }
        .control-pill.mastered.active .checkbox { background: #f59e0b; border-color: #f59e0b; }

        .v-color-base { color: var(--v-base); }
        .v-color-gold { color: var(--v-gold); }
        .v-color-gummy { color: var(--v-gummy); }
        .v-color-galaxy { color: var(--v-galaxy); }
        .v-color-holofoil { color: var(--v-holofoil); }
        .v-color-cube { color: var(--v-cube); }

        #confetti-canvas {
            position: fixed; top: 0; left: 0; pointer-events: none; z-index: 999;
        }
    </style>
</head>

    <div class="header-controls">
        <h1>Fortnite Sprite Tracker</h1>
        <div>
            <input type="text" id="search" class="search-bar" placeholder="Search sprites or buffs..." onkeyup="renderGrid()">
            <button class="btn" onclick="triggerAdminUpload()">Update Sprite Sheet (Admin)</button>
            <button class="btn btn-danger" onclick="resetAll()">Reset All Progress</button>
            <input type="file" id="file-input" style="display: none;" accept="image/*" onchange="processSpriteSheet(event)">
        </div>
    </div>

    <div class="progress-section">
        <div>
            <div class="progress-label"><span>Total Collected</span> <span id="progress-text">0 / 91 (0%)</span></div>
            <div class="progress-track"><div class="progress-fill" id="progress-bar" style="width: 0%"></div></div>
        </div>
        <div>
            <div class="progress-label"><span>Total Mastered</span> <span id="mastery-overall-text">0 / 91 (0%)</span></div>
            <div class="progress-track"><div class="progress-fill mastery-fill" id="mastery-overall-bar" style="width: 0%"></div></div>
        </div>
    </div>

    <div class="tools-section">
        <div class="tool-card">
            <h3>Match Timer</h3>
            <div class="timer-display" id="timer-display">02:00:00</div>
            <div class="timer-controls">
                <button class="btn btn-timer-start" id="timer-start-btn" onclick="toggleTimer()">Start</button>
                <button class="btn" onclick="configureTimer()">Set Time</button>
                <button class="btn btn-danger" onclick="resetTimer()">Reset</button>
            </div>
        </div>
        <div class="tool-card">
            <h3>Loadout Optimizer</h3>
            <select id="opt-slot-1" onchange="updateLoadoutOptimization()"></select>
            <div id="optimizer-output" style="margin-top: 10px; background: #2a2a2a; padding: 10px; border-radius: 5px; font-size: 0.9rem;">
                Select your equipped sprite above to review its exact buff.
            </div>
        </div>
    </div>

    <div class="grid" id="sprite-grid"></div>

    <!-- Details Modal -->
    <div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h2 id="modal-title" style="margin:0;">Sprite Name</h2>
                <button class="btn" onclick="document.getElementById('modal-overlay').classList.remove('active')">Close</button>
            </div>
            
            <p style="font-size: 0.9rem; color: var(--text-muted);"><strong>Found:</strong> <span id="modal-obtain-text"></span></p>
            
            <div class="modal-chances-grid" id="modal-chances-grid"></div>

            <div style="margin-bottom: 15px;">
                <div class="progress-label"><span>Sprite Mastery</span> <span id="modal-mastery-progress-text">0 / 5 (0%)</span></div>
                <div class="progress-track"><div class="progress-fill mastery-fill" id="modal-mastery-progress-bar" style="width: 0%"></div></div>
            </div>

            <button class="btn" style="width: 100%; margin-bottom: 15px;" onclick="toggleAllVariantsForCurrentSprite()">Toggle All Collected</button>
            
            <div id="variant-list"></div>
        </div>
    </div>

    <!-- Timer Alarm Modal -->
    <div class="modal-overlay" id="timer-alarm-overlay">
        <div class="modal-content" style="text-align: center;">
            <h2 style="color: #ef4444; font-size: 2rem;">Time's Up!</h2>
            <p>Your configured match timer has ended.</p>
            <button class="btn" onclick="dismissTimerAlarm()">Dismiss</button>
        </div>
    </div>

        async function loadLatestSpriteSheet() {
            try {
                const response = await fetch(
                    `https://api.jsonbin.io/v3/b/${BIN_ID}/latest`,
                    {
                        headers: {
                            "X-Master-Key": API_KEY
                        }
                    }
                );

                const data = await response.json();

                if (data.record && data.record.spriteSheet) {
                    customSheetImage = data.record.spriteSheet;
                    localStorage.setItem("customSpriteSheet", customSheetImage);
                } else {
                    const cached = localStorage.getItem("customSpriteSheet");
                    if (cached) customSheetImage = cached;
                }
            } catch (err) {
                console.log("Couldn't load online sprite sheet.", err);
                const cached = localStorage.getItem("customSpriteSheet");
                if (cached) customSheetImage = cached;
            }
        }

        async function initApp() {
            populateOptimizerSelects();
            setupTimerDisplay();
            
            // Fetch online sprite sheet before first grid render
            await loadLatestSpriteSheet();

            renderGrid();
            updateProgress();
            updateLoadoutOptimization();
        }

        function populateOptimizerSelects() {
            const select1 = document.getElementById('opt-slot-1');
            let html = '<option value="">-- Choose Sprite --</option>';
            spritesData.forEach(s => {
                html += `<option value="${s.id}">${s.name} (${s.rarity.toUpperCase()})</option>`;
            });
            select1.innerHTML = html;
        }

        function updateLoadoutOptimization() {
            const slot1Id = document.getElementById('opt-slot-1').value;
            const output = document.getElementById('optimizer-output');
            
            if (!slot1Id) {
                output.innerHTML = 'Select your equipped sprite above to review its exact buff.';
                return;
            }

            const sprite = spritesData.find(s => s.id === slot1Id);
            if (!sprite) {
                output.innerHTML = 'Sprite not found.';
                return;
            }

            output.innerHTML = `<strong style="color: var(--rarity-${sprite.rarity}); font-size: 1rem;">${sprite.name} Sprite (${sprite.rarity.toUpperCase()})</strong><br><span style="color: #2dd4bf; font-size: 0.95rem; margin-top: 4px; display: block;">Buff: ${sprite.buff}</span>`;
        }

        function renderGrid() {
            const grid = document.getElementById('sprite-grid');
            const searchVal = document.getElementById('search').value.toLowerCase();
            grid.innerHTML = '';

            spritesData.forEach(s => {
                if (searchVal && !s.name.toLowerCase().includes(searchVal) && !s.buff.toLowerCase().includes(searchVal)) {
                    return;
                }

                const variants = s.variants;
                const totalVariants = variants.length;
                let collectedCount = 0;
                let masteredCount = 0;

                variants.forEach(v => {
                    if (collectedData[s.id]?.[v]) collectedCount++;
                    if (masteryData[s.id]?.[v]) masteredCount++;
                });

                const isCompleted = collectedCount === totalVariants;
                const isMastered = masteredCount === totalVariants;

                const card = document.createElement('div');
                card.className = `card ${isMastered ? 'mastered' : (isCompleted ? 'completed' : '')}`;
                card.onclick = () => openModal(s.id);

                let dotsHtml = '';
                variants.forEach(v => {
                    const isActive = collectedData[s.id]?.[v];
                    const classKey = getVariantClassKey(v);
                    dotsHtml += `<div class="v-dot ${isActive ? 'active-' + classKey : ''}"></div>`;
                });

                card.innerHTML = `
                    <div class="badge" style="color: var(--rarity-${s.rarity});">${s.rarity.toUpperCase()}</div>
                    <div class="card-preview">
                        <div class="sprite-img" style="background: ${s.bg}; background-image: url('${customSheetImage}'); background-size: 500% 500%; background-position: -${s.col * 100}% -${s.row * 100}%;"></div>
                        ${isMastered ? '<div class="mastered-stamp">MASTERED</div>' : (isCompleted ? '<div class="owned-stamp">COLLECTED</div>' : '')}
                    </div>
                    <div style="padding: 10px; font-size: 0.9rem; font-weight: 800; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--rarity-${s.rarity});">
                        ${s.name}
                    </div>
                    <div class="card-variants-bar">
                        ${dotsHtml}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openModal(id) {
            activeModalSpriteId = id;
            const s = spritesData.find(item => item.id === id);
            if (!s) return;

            document.getElementById('modal-title').innerText = `${s.name} Sprite`;
            document.getElementById('modal-obtain-text').innerText = s.location;

            const chancesGrid = document.getElementById('modal-chances-grid');
            chancesGrid.innerHTML = '';
            s.variants.forEach(v => {
                const rate = s.rates[v] || '—';
                chancesGrid.innerHTML += `
                    <div class="chance-item">
                        <span class="chance-label">${getVariantLabel(v)}</span>
                        <span class="chance-val">${rate}</span>
                    </div>
                `;
            });

            renderVariantList(s);
            document.getElementById('modal-overlay').classList.add('active');
        }

        function closeModal(e) {
            if (e.target.id === 'modal-overlay') {
                document.getElementById('modal-overlay').classList.remove('active');
                activeModalSpriteId = null;
                renderGrid();
                updateProgress();
            }
        }

        function renderVariantList(s) {
            const list = document.getElementById('variant-list');
            list.innerHTML = '';

            if (!collectedData[s.id]) collectedData[s.id] = {};
            if (!masteryData[s.id]) masteryData[s.id] = {};

            let spriteMasteredCount = 0;
            s.variants.forEach(v => {
                if (masteryData[s.id][v]) spriteMasteredCount++;
            });

            const masteryPercent = Math.round((spriteMasteredCount / s.variants.length) * 100);
            document.getElementById('modal-mastery-progress-text').innerText = `${spriteMasteredCount} / ${s.variants.length} (${masteryPercent}%)`;
            document.getElementById('modal-mastery-progress-bar').style.width = `${masteryPercent}%`;

            s.variants.forEach(v => {
                const isCollected = !!collectedData[s.id][v];
                const isMastered = !!masteryData[s.id][v];
                
                const item = document.createElement('div');
                item.className = `variant-item`;

                item.innerHTML = `
                    <div class="variant-item-top">
                        <div class="variant-label v-color-${getVariantClassKey(v)}">${getVariantLabel(v)} Variant</div>
                    </div>
                    <div class="variant-controls-group">
                        <div class="control-pill collected ${isCollected ? 'active' : ''}" onclick="toggleVariant('${s.id}', '${v}')">
                            <span>Collected</span>
                            <div class="checkbox"></div>
                        </div>
                        <div class="control-pill mastered ${isMastered ? 'active' : ''}" onclick="toggleVariantMastery('${s.id}', '${v}')">
                            <span>Mastered</span>
                            <div class="checkbox"></div>
                        </div>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        function toggleVariant(spriteId, variantKey) {
            if (!collectedData[spriteId]) collectedData[spriteId] = {};
            collectedData[spriteId][variantKey] = !collectedData[spriteId][variantKey];
            localStorage.setItem('spriteData', JSON.stringify(collectedData));

            const s = spritesData.find(item => item.id === spriteId);
            renderVariantList(s);
            checkCompletionCelebration();
        }

        function toggleVariantMastery(spriteId, variantKey) {
            if (!masteryData[spriteId]) masteryData[spriteId] = {};
            masteryData[spriteId][variantKey] = !masteryData[spriteId][variantKey];
            localStorage.setItem('spriteVariantMastery', JSON.stringify(masteryData));

            const s = spritesData.find(item => item.id === spriteId);
            renderVariantList(s);
            updateProgress();
        }

        function toggleAllVariantsForCurrentSprite() {
            if (!activeModalSpriteId) return;
            const s = spritesData.find(item => item.id === activeModalSpriteId);
            if (!s) return;

            if (!collectedData[s.id]) collectedData[s.id] = {};
            if (!masteryData[s.id]) masteryData[s.id] = {};
            
            const allCollected = s.variants.every(v => collectedData[s.id][v]);
            s.variants.forEach(v => {
                collectedData[s.id][v] = !allCollected;
                masteryData[s.id][v] = !allCollected;
            });

            localStorage.setItem('spriteData', JSON.stringify(collectedData));
            localStorage.setItem('spriteVariantMastery', JSON.stringify(masteryData));
            renderVariantList(s);
            checkCompletionCelebration();
        }

        function updateProgress() {
            let totalVariantsCount = 0;
            let collectedVariantsCount = 0;
            let masteredVariantsCount = 0;

            spritesData.forEach(s => {
                s.variants.forEach(v => {
                    totalVariantsCount++;
                    if (collectedData[s.id]?.[v]) {
                        collectedVariantsCount++;
                    }
                    if (masteryData[s.id]?.[v]) {
                        masteredVariantsCount++;
                    }
                });
            });

            const collectedPercent = totalVariantsCount > 0 ? Math.round((collectedVariantsCount / totalVariantsCount) * 100) : 0;
            document.getElementById('progress-text').innerText = `${collectedVariantsCount} / ${totalVariantsCount} (${collectedPercent}%)`;
            document.getElementById('progress-bar').style.width = `${collectedPercent}%`;

            const masteryPercent = totalVariantsCount > 0 ? Math.round((masteredVariantsCount / totalVariantsCount) * 100) : 0;
            document.getElementById('mastery-overall-text').innerText = `${masteredVariantsCount} / ${totalVariantsCount} (${masteryPercent}%)`;
            document.getElementById('mastery-overall-bar').style.width = `${masteryPercent}%`;
        }

        function checkCompletionCelebration() {
            let totalVariantsCount = 0;
            let collectedVariantsCount = 0;

            spritesData.forEach(s => {
                s.variants.forEach(v => {
                    totalVariantsCount++;
                    if (collectedData[s.id]?.[v]) collectedVariantsCount++;
                });
            });

            if (collectedVariantsCount === totalVariantsCount && !hasFiredConfettiThisSession) {
                hasFiredConfettiThisSession = true;
                fireConfetti();
            }
        }

        function triggerAdminUpload() {
            const pwd = prompt("Enter Admin Password:");
            if (pwd !== ADMIN_PASSWORD) {
                if (pwd !== null) alert("Incorrect Password!");
                return;
            }

            const choice = prompt(
                "Choose sprite sheet upload method:\n\n" +
                "1. Paste Image URL (Recommended for Cloud Sync)\n" +
                "2. Upload Local File", 
                "1"
            );

            if (choice === "1") {
                const url = prompt("Paste direct image URL (e.g., https://i.imgur.com/your-image.png):");
                if (url && url.trim()) {
                    saveSpriteSheetToCloud(url.trim());
                }
            } else if (choice === "2") {
                document.getElementById('file-input').click();
            }
        }

        async function saveSpriteSheetToCloud(imageUrlOrData) {
            // 1. Instantly update UI and Local Cache
            customSheetImage = imageUrlOrData;
            localStorage.setItem('customSpriteSheet', customSheetImage);
            renderGrid();

            // 2. Sync to JSONBin
            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json",
                        "X-Master-Key": API_KEY
                    },
                    body: JSON.stringify({ spriteSheet: imageUrlOrData })
                });

                if (response.ok) {
                    alert("Sprite sheet updated and synced to the cloud successfully!");
                } else {
                    const errData = await response.json().catch(() => ({}));
                    alert(`Cloud sync failed (HTTP ${response.status}): ${errData.message || 'Check your BIN_ID and API_KEY constants.'}`);
                }
            } catch (err) {
                console.error("Cloud upload error:", err);
                alert("Network error: Failed to connect to JSONBin.");
            }
        }

        async function processSpriteSheet(event) {
            const file = event.target.files[0];
            if (!file) return;

            // Warn if file size exceeds JSONBin's 100KB free limit
            if (file.size > 100 * 1024) {
                const proceed = confirm(
                    `Warning: File size is ${Math.round(file.size / 1024)} KB.\n` +
                    `JSONBin free tier caps records at 100 KB, so direct file Base64 uploads will likely fail.\n\n` +
                    `Tip: Upload your image to Imgur or GitHub Pages and paste the URL instead.\n\n` +
                    `Attempt upload anyway?`
                );
                if (!proceed) return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                saveSpriteSheetToCloud(e.target.result);
            };
            reader.readAsDataURL(file);
        }

        function resetAll() {
            if (confirm("Are you sure you want to reset all collected and mastered progress?")) {
                localStorage.removeItem('spriteData');
                localStorage.removeItem('spriteVariantMastery');
                collectedData = {};
                masteryData = {};
                hasFiredConfettiThisSession = false;
                renderGrid();
                updateProgress();
                if (activeModalSpriteId) {
                    openModal(activeModalSpriteId);
                }
            }
        }

        // Timer Functionality
        let timerSeconds = 7200;
        let timerInterval = null;
        let isTimerRunning = false;

        function setupTimerDisplay() {
            updateTimerDisplayUI();
        }

        function updateTimerDisplayUI() {
            const hours = String(Math.floor(timerSeconds / 3600)).padStart(2, '0');
            const minutes = String(Math.floor((timerSeconds % 3600) / 60)).padStart(2, '0');
            const seconds = String(timerSeconds % 60).padStart(2, '0');
            document.getElementById('timer-display').innerText = `${hours}:${minutes}:${seconds}`;
        }

        function toggleTimer() {
            const btn = document.getElementById('timer-start-btn');
            if (isTimerRunning) {
                clearInterval(timerInterval);
                isTimerRunning = false;
                btn.innerText = 'Start';
                btn.classList.remove('btn-timer-pause');
                btn.classList.add('btn-timer-start');
            } else {
                if (timerSeconds <= 0) return;
                isTimerRunning = true;
                btn.innerText = 'Pause';
                btn.classList.remove('btn-timer-start');
                btn.classList.add('btn-timer-pause');

                timerInterval = setInterval(() => {
                    if (timerSeconds > 0) {
                        timerSeconds--;
                        updateTimerDisplayUI();
                    }
                    if (timerSeconds <= 0) {
                        clearInterval(timerInterval);
                        isTimerRunning = false;
                        btn.innerText = 'Start';
                        btn.classList.remove('btn-timer-pause');
                        btn.classList.add('btn-timer-start');
                        triggerTimerAlarm();
                    }
                }, 1000);
            }
        }

        function configureTimer() {
            const input = prompt("Enter countdown time in minutes:", "120");
            if (input !== null && !isNaN(input) && Number(input) > 0) {
                timerSeconds = Number(input) * 60;
                updateTimerDisplayUI();
            }
        }

        function resetTimer() {
            if (isTimerRunning) {
                toggleTimer();
            }
            timerSeconds = 7200;
            updateTimerDisplayUI();
        }

        function triggerTimerAlarm() {
            document.getElementById('timer-alarm-overlay').classList.add('active');
        }

        function dismissTimerAlarm() {
            document.getElementById('timer-alarm-overlay').classList.remove('active');
        }

        function fireConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            for (let i = 0; i < 150; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 14,
                    vy: (Math.random() - 0.5) * 14 - 4,
                    size: Math.random() * 8 + 4,
                    color: ['#facc15', '#8b5cf6', '#2dd4bf', '#3b82f6', '#f472b6'][Math.floor(Math.random() * 5)],
                    life: Math.random() * 100 + 50
                });
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach((p, index) => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.3;
                    p.life--;
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                    if (p.life <= 0) particles.splice(index, 1);
                });
                if (particles.length > 0) {
                    requestAnimationFrame(animate);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }
            animate();
        }

        window.onload = initApp;
    </script>
</body>
